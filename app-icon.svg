<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Prompt Deck wordmark icon: the app's own PD logo.
       Corners are rounded so the icon sits correctly in the macOS Dock. -->
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="185" ry="185"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="#eef2f9"/>
    <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="678">
      <text x="73" y="742" fill="#2e3135">P</text>
      <text x="503" y="742" fill="#5a7b8c">D</text>
    </g>
  </g>
</svg>
